[project]
name = "mem-tui"
version = "0.1.0"
description = "Async TUI treemap of macOS process memory usage (GrandPerspective for RAM)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=0.60.0",
    "psutil>=5.9.0",
]

[project.scripts]
mem-tui = "mem_tui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mem_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
